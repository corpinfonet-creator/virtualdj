services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autodj
      POSTGRES_USER: autodj
      POSTGRES_PASSWORD: autodj_dev_password
    ports:
      - "5434:5432"
    volumes:
      - autodj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodj -d autodj"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - autodj_redis:/data

volumes:
  autodj_postgres:
  autodj_redis:
